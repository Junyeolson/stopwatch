<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Growth Reset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800;900&family=Noto+Sans+KR:wght@300;500;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --fg:#f5f5f7; --dim:#6e6e73;
    --purple:#7823DC; --purple2:#A86BFF; --purple3:#E3CCFF;
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:'Inter','Noto Sans KR',system-ui,sans-serif;color:var(--fg)}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--bg);transform-origin:center}
  .glow{position:absolute;left:50%;top:55%;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;
    background:radial-gradient(circle,rgba(120,35,220,.42) 0%,rgba(120,35,220,.12) 35%,rgba(120,35,220,0) 62%);
    opacity:0;pointer-events:none}
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .w{display:block;white-space:pre;text-align:center}
  .ch{display:inline-block;will-change:transform,opacity,filter}
  .huge{font-weight:900;font-size:360px;letter-spacing:-.045em;line-height:1}
  .big{font-weight:900;font-size:190px;letter-spacing:-.035em;line-height:1.08}
  .mid{font-weight:800;font-size:110px;letter-spacing:-.02em;line-height:1.1}
  .light{font-weight:300;letter-spacing:-.01em}
  .small{font-weight:500;font-size:52px;color:var(--dim);letter-spacing:.01em}
  .p{color:var(--purple2)}
  .grad{background:linear-gradient(100deg,var(--purple) 0%,var(--purple2) 55%,var(--purple3) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #bar{position:absolute;left:0;bottom:0;height:6px;width:100%;background:var(--purple);transform-origin:left;transform:scaleX(0)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;
    background:#000;z-index:10;cursor:pointer}
  #overlay .btn{width:200px;height:200px;border-radius:50%;background:var(--purple);display:grid;place-items:center;
    box-shadow:0 0 120px rgba(120,35,220,.6);transition:transform .2s}
  #overlay:hover .btn{transform:scale(1.06)}
  #overlay .btn::after{content:"";margin-left:18px;border-style:solid;border-width:44px 0 44px 72px;border-color:transparent transparent transparent #fff}
  #overlay .t{font-size:44px;font-weight:500;color:var(--dim)}
  #overlay .t b{color:var(--fg);font-weight:800}
  #replay{position:absolute;right:60px;bottom:50px;font-size:34px;color:var(--dim);border:2px solid #333;border-radius:40px;
    padding:14px 34px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s;z-index:5}
  #replay.on{opacity:1;pointer-events:auto}
  #replay:hover{color:var(--fg);border-color:var(--purple)}
  #note{position:absolute;left:60px;bottom:50px;font-size:28px;color:#555;z-index:5}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="glow" id="glow"></div>
    <div id="bar"></div>
    <div id="replay">↻ 다시 보기</div>
    <div id="note"></div>
    <div id="overlay">
      <div class="btn"></div>
      <div class="t"><b>30초</b> · 소리를 켜 주세요</div>
    </div>
  </div>
</div>

<script>
/* ---------- 무대 크기 맞추기 ---------- */
const stage = document.getElementById('stage');
const glowEl = document.getElementById('glow');
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

/* ---------- 애니메이션 도구 ---------- */
const EASE = 'cubic-bezier(.16,1,.3,1)';
const A = (e, kf, o) => e.animate(kf, Object.assign({ fill:'both', easing:EASE }, o));
function el(tag, cls, parent, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}
function charsIn(parent, text, { wrap='', ch='', kf, dur=700, stagger=50, delay=0 }){
  const w = el('div', 'w ' + wrap, parent);
  const spans = [...text].map(c => el('span', 'ch ' + ch, w, c === ' ' ? ' ' : c));
  spans.forEach((s, i) => A(s, kf, { duration:dur, delay:delay + i*stagger }));
  return { w, spans };
}
const timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
function count(e, from, to, dur, delay, fmt){
  later(delay, () => {
    const t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), v = from + (to - from) * (1 - Math.pow(1 - k, 3));
      e.textContent = fmt(v);
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
function glow(op, dur){
  const cur = parseFloat(getComputedStyle(glowEl).opacity) || 0;
  glowEl.getAnimations().forEach(a => a.cancel());
  A(glowEl, [{ opacity:cur }, { opacity:op }], { duration:dur, easing:'ease-out' });
}
const fadeUp = [{ opacity:0, transform:'translateY(40px)' }, { opacity:1, transform:'none' }];
const fade   = [{ opacity:0 }, { opacity:1 }];
const rise   = [{ opacity:0, transform:'translateY(110px)', filter:'blur(14px)' }, { opacity:1, transform:'none', filter:'blur(0)' }];

/* ---------- 음성 ---------- */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
  voice = vs.find(v => /SunHi|Natural|Online/i.test(v.name)) || vs.find(v => /Google/i.test(v.name)) || vs[0] || null;
  document.getElementById('note').textContent = voice ? '' : '한국어 음성이 없어 자막만 재생됩니다';
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!('speechSynthesis' in window) || !voice) return;
  const u = new SpeechSynthesisUtterance(text);
  u.voice = voice; u.lang = voice.lang; u.rate = 1.08; u.pitch = 0.95; u.volume = 1;
  speechSynthesis.speak(u);
}

/* ---------- 장면 ---------- */
const scenes = [
  { at:0, say:[[0,'매출은 60% 성장했습니다.']], build(L){
      glow(.9, 900);
      A(el('div','small',L,'매출'), fadeUp, { duration:700 });
      const punch = el('div','',L);
      const row = el('div','huge',punch);
      const num = el('span','grad',row,'+0'); el('span','grad',row,'%');
      A(row, [{ opacity:0, transform:'scale(.55)', filter:'blur(40px)' }, { opacity:1, transform:'none', filter:'blur(0)' }], { duration:1000, delay:150 });
      count(num, 0, 60, 1300, 250, v => '+' + Math.round(v));
      A(punch, [{ transform:'scale(1)' }, { transform:'scale(1.08)' }, { transform:'scale(1)' }], { duration:450, delay:1550, easing:'ease-out' });
      A(el('div','small',L,'2020 → 2026, 매장당 월평균'), fade, { duration:600, delay:1900 });
  }},
  { at:3200, say:[[0,'그런데, 주문은 제자리입니다.']], build(L){
      glow(.12, 600);
      charsIn(L, '그런데,', { wrap:'big', kf:[{ opacity:0, transform:'translateY(-200px) rotate(-10deg)' }, { opacity:1, transform:'none' }], dur:650, stagger:90 });
      const row = el('div','mid',L); row.style.marginTop = '40px';
      el('span','',row,'주문은 ');
      const b = el('span','p',row,'제자리.'); b.style.display = 'inline-block';
      A(row, [{ opacity:0, letterSpacing:'.6em', filter:'blur(10px)' }, { opacity:1, letterSpacing:'-.02em', filter:'blur(0)' }], { duration:1100, delay:900 });
      A(b, [{ transform:'none' }, { transform:'translateX(-16px)' }, { transform:'translateX(16px)' }, { transform:'translateX(-8px)' }, { transform:'none' }], { duration:500, delay:2100, easing:'ease-in-out' });
      const s = el('div','small',L,'월 주문 3,425 → 3,470건  (2022 → 2026)'); s.style.marginTop = '40px';
      A(s, fade, { duration:600, delay:1700 });
  }},
  { at:6500, say:[[0,'성장을 만든 건, 가격이었습니다.']], build(L){
      glow(.65, 500);
      A(el('div','small',L,'성장을 만든 건'), fadeUp, { duration:600 });
      const row = el('div','',L); row.style.cssText = 'display:flex;align-items:flex-start;gap:30px';
      charsIn(row, '가격', { wrap:'huge', ch:'grad', kf:[{ opacity:0, transform:'scale(3)', filter:'blur(24px)' }, { opacity:1, transform:'scale(1)', filter:'blur(0)' }], dur:600, stagger:170, delay:600 });
      const tag = el('div','mid p',row,'+25%'); tag.style.marginTop = '50px';
      A(tag, [{ opacity:0, transform:'translateX(120px)' }, { opacity:1, transform:'none' }], { duration:700, delay:1500 });
      A(el('div','small',L,'객단가 2.40 → 2.99만원'), fade, { duration:600, delay:2000 });
  }},
  { at:10000, say:[[0,'자사앱은 31%.'],[2100,'하지만, 배달앱 수수료는 그대로입니다.']], build(L){
      glow(.5, 500);
      const a = el('div','',L); a.style.cssText = 'display:flex;flex-direction:column;align-items:center';
      A(el('div','small',a,'자사앱 주문 비중'), fadeUp, { duration:600 });
      const n = el('div','huge grad',a,'0%');
      A(n, [{ opacity:0, transform:'scale(.6)' }, { opacity:1, transform:'none' }], { duration:900, delay:150 });
      count(n, 0, 31, 1200, 200, v => Math.round(v) + '%');
      A(a, [{ transform:'none', opacity:1 }, { transform:'translateY(-330px) scale(.4)', opacity:.35 }], { duration:850, delay:2100 });
      const b = el('div','',L); b.style.cssText = 'position:absolute;top:400px;left:0;right:0;display:flex;flex-direction:column;align-items:center';
      A(el('div','small',b,'배달앱 수수료 · 매출 대비'), fadeUp, { duration:600, delay:2400 });
      const fee = el('div','huge',b,'7.0%');
      A(fee, [{ opacity:0, transform:'translateY(-140px)' }, { opacity:1, transform:'translateY(14px)', offset:.7 }, { opacity:1, transform:'none' }], { duration:800, delay:2600 });
      const s = el('div','mid p',b,'4년째 그대로'); s.style.fontSize = '64px';
      A(s, fade, { duration:600, delay:3300 });
  }},
  { at:15000, say:[[0,'그리고 인건비는, 4.5 퍼센트포인트 올랐습니다.']], build(L){
      glow(.4, 500);
      A(el('div','small',L,'매출 대비 인건비'), fadeUp, { duration:600 });
      const chart = el('div','',L); chart.style.cssText = 'display:flex;align-items:flex-end;gap:120px;margin-top:40px;margin-right:420px';
      const mk = (year, val, bg, delay) => {
        const col = el('div','',chart); col.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:16px';
        const v = el('div','mid',col,'0%'); v.style.fontSize = '76px';
        const bar = el('div','',col); bar.style.cssText = `width:230px;height:${val*16}px;background:${bg};border-radius:12px 12px 0 0;transform-origin:bottom`;
        el('div','small',col,year);
        A(bar, [{ transform:'scaleY(0)' }, { transform:'scaleY(1)' }], { duration:1100, delay });
        A(v, fade, { duration:300, delay });
        count(v, 0, val, 1100, delay, x => x.toFixed(1) + '%');
      };
      mk('2020', 24.5, '#2c2c2e', 300);
      mk('2026', 29.0, 'linear-gradient(180deg,#A86BFF,#7823DC)', 800);
      const tag = el('div','big grad',L,'+4.5%p'); tag.style.cssText += ';position:absolute;right:160px;top:420px;font-size:170px';
      A(tag, [{ opacity:0, transform:'scale(.3) rotate(-12deg)' }, { opacity:1, transform:'scale(1.12) rotate(2deg)', offset:.7 }, { opacity:1, transform:'none' }], { duration:700, delay:2000 });
  }},
  { at:19500, say:[[400,'그리고, 하나 더.']], build(L){
      glow(0, 900);
      charsIn(L, '하나 더.', { wrap:'mid light', kf:[{ opacity:0, filter:'blur(14px)' }, { opacity:1, filter:'blur(0)' }], dur:900, stagger:150, delay:500 });
  }},
  { at:22500, say:[[200,'고객.'],[1500,'채널.'],[2800,'사람.']], build(L){
      glow(.5, 600);
      const row = el('div','',L); row.style.cssText = 'display:flex;gap:110px';
      const words = ['고객.','채널.','사람.'], subs = ['주문 수 회복','배달앱 → 자사앱','인력 안정화'];
      words.forEach((w, i) => {
        const d = 200 + i*1300;
        const col = el('div','',row); col.style.cssText = 'display:flex;flex-direction:column;align-items:center';
        const t = el('div','big',col,w);
        const u = el('div','',col); u.style.cssText = 'height:14px;width:100%;background:var(--purple);border-radius:7px;transform-origin:left;margin-top:12px';
        const s = el('div','small',col,subs[i]); s.style.marginTop = '26px';
        A(t, [{ opacity:0, transform:'translateY(90px)', filter:'blur(16px)' }, { opacity:1, transform:'none', filter:'blur(0)' }], { duration:700, delay:d });
        A(u, [{ transform:'scaleX(0)' }, { transform:'scaleX(1)' }], { duration:600, delay:d + 300 });
        A(s, fade, { duration:500, delay:d + 500 });
        if (i < 2) A(t, [{ color:'#f5f5f7' }, { color:'#6e6e73' }], { duration:400, delay:d + 1300 });
      });
  }},
  { at:27000, say:[[0,'이제, 성장의 방식을 바꿀 때입니다.']], build(L){
      glow(1, 1200);
      A(el('div','small',L,'이제,'), fadeUp, { duration:600 });
      charsIn(L, '성장의 방식을', { wrap:'big', kf:rise, dur:700, stagger:45, delay:300 });
      charsIn(L, '바꿀 때.', { wrap:'big', ch:'grad', kf:rise, dur:800, stagger:80, delay:900 });
  }},
];
const TOTAL = 30000;

/* ---------- 타임라인 ---------- */
let current = null;
function nextLayer(){
  if (current){
    const old = current;
    A(old, [{ opacity:1, filter:'blur(0)', transform:'none' }, { opacity:0, filter:'blur(14px)', transform:'scale(1.05)' }], { duration:420, easing:'ease-in' })
      .finished.then(() => old.remove());
  }
  current = el('div','layer',stage);
  return current;
}
function play(){
  timers.forEach(clearTimeout); timers.length = 0;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  stage.querySelectorAll('.layer').forEach(l => l.remove()); current = null;
  document.getElementById('replay').classList.remove('on');
  const bar = document.getElementById('bar');
  bar.getAnimations().forEach(a => a.cancel());
  A(bar, [{ transform:'scaleX(0)' }, { transform:'scaleX(1)' }], { duration:TOTAL, easing:'linear' });
  scenes.forEach(sc => {
    later(sc.at, () => sc.build(nextLayer()));
    sc.say.forEach(([ms, text]) => later(sc.at + ms, () => say(text)));
  });
  later(TOTAL, () => document.getElementById('replay').classList.add('on'));
}
const overlay = document.getElementById('overlay');
function start(){
  if (!overlay.isConnected) return;
  A(overlay, fade.slice().reverse(), { duration:500 }).finished.then(() => overlay.remove());
  play();
}
overlay.addEventListener('click', start);
document.getElementById('replay').addEventListener('click', play);
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); overlay.isConnected ? start() : play(); } });
</script>
</body>
</html>
