<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 못 뺏는 직업 TOP10</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;color:#eef;font-family:'Malgun Gothic',sans-serif}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;box-sizing:border-box}
  canvas{height:calc(100vh - 90px);max-width:calc(100vw - 16px);aspect-ratio:9/16;object-fit:contain;border-radius:14px;box-shadow:0 0 40px #0008;background:#000}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:#2b2f45;color:#fff}
  button.rec{background:#e5364b}
  button:disabled{opacity:.4;cursor:default}
  #status{font-size:13px;opacity:.75}
  a{color:#ffd54a}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="bar">
    <button id="play">▶ 재생</button>
    <button id="rec" class="rec">⏺ 녹화해서 영상 저장</button>
    <span id="status"></span>
  </div>
</div>
<script>
const VOICE = /*VOICE_DATA*/[];
const W = 1080, H = 1920, TOTAL = 30;
const FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";
const EMOJI = "'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const RANKS = {
  10: { name: 'AI 감사 전문가',       cat: 'AI 거버넌스',   why: 'AI의 결정을 검증하고 책임진다',   icon: '⚖️', hue: 200 },
  9:  { name: '산업로봇 정비 기술자', cat: '자동화 설비',   why: '자동화가 늘수록 더 필요하다',     icon: '🤖', hue: 185 },
  8:  { name: '특수교사',             cat: '교육',          why: '아이마다 다른 맞춤 교감',         icon: '🧩', hue: 140 },
  7:  { name: '임상심리사',           cat: '정신건강',      why: '위기 개입과 깊은 신뢰',           icon: '🧠', hue: 280 },
  6:  { name: '재활치료사',           cat: '물리·작업치료', why: '손으로 하는 맞춤 치료',           icon: '🤲', hue: 160 },
  5:  { name: '요양보호사',           cat: '노인돌봄',      why: '초고령사회, 돌봄 수요 폭증',      icon: '👵', hue: 330 },
  4:  { name: '응급구조사·소방관',    cat: '재난·응급',     why: '예측 불가 현장의 즉각 판단',      icon: '🚒', hue: 5 },
  3:  { name: '간호사',               cat: '의료',          why: '24시간 관찰과 직접 처치',         icon: '🩺', hue: 210 },
  2:  { name: '배관·공조 설비기술자', cat: '건설·설비',     why: '좁고 불규칙한 현장 = 로봇의 약점', icon: '🔧', hue: 25 },
  1:  { name: '전기기사',             cat: '전력·신재생',   why: '전력·데이터센터 시대 핵심 인력',  icon: '⚡', hue: 48 },
};

// ---------- timeline (driven by narration length) ----------
const IDS = ['intro', 'r10', 'r9', 'r8', 'r7', 'r6', 'r5', 'r4', 'r3', 'r2', 'r1', 'outro'];
const SEGS = (() => {
  const durs = IDS.map(id => (VOICE.find(v => v.id === id) || { dur: 2.2 }).dur);
  const sum = durs.reduce((a, b) => a + b, 0);
  const pad = Math.max(0.05, (TOTAL - sum) / IDS.length);
  let t = 0;
  return IDS.map((id, i) => {
    const s = { id, start: t, voice: durs[i], len: durs[i] + pad, rank: id[0] === 'r' ? +id.slice(1) : null };
    t += s.len; return s;
  });
})();
const segOf = id => SEGS.find(s => s.id === id);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const rand = rng(42);
const PARTICLES = Array.from({ length: 70 }, () => ({ x: rand() * W, y: rand() * H, s: 2 + rand() * 6, v: 20 + rand() * 70, p: rand() * 6 }));
const CONFETTI = Array.from({ length: 140 }, () => ({ a: rand() * Math.PI * 2, sp: 500 + rand() * 1100, r: rand() * 6, vr: (rand() - .5) * 14, w: 14 + rand() * 16, c: ['#ffd54a', '#ff5d73', '#4ad6ff', '#7cff8a', '#ffffff', '#b07cff'][Math.floor(rand() * 6)] }));

function font(size, weight = 900, fam = FONT) { ctx.font = `${weight} ${size}px ${fam}`; }
function fit(text, size, maxW, weight = 900) {
  let s = size; font(s, weight);
  while (ctx.measureText(text).width > maxW && s > 20) { s -= 3; font(s, weight); }
  return s;
}
function hsl(h, s, l, a = 1) { return `hsla(${h},${s}%,${l}%,${a})`; }
function goldGrad(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#fff6c8'); g.addColorStop(.45, '#ffd54a'); g.addColorStop(1, '#ff9d1c');
  return g;
}
function text(str, x, y, { size = 60, weight = 900, color = '#fff', align = 'center', fam = FONT, glow = 0, glowColor = '#000', stroke = 0, strokeColor = '#000' } = {}) {
  font(size, weight, fam);
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowBlur = glow; ctx.shadowColor = glowColor; }
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}
function hueAt(t) {
  const i = SEGS.findIndex(s => t < s.start + s.len);
  const idx = i < 0 ? SEGS.length - 1 : i;
  const h = s => s.id === 'intro' ? 255 : s.id === 'outro' ? 45 : RANKS[s.rank].hue;
  const cur = SEGS[idx], prev = SEGS[Math.max(0, idx - 1)];
  const k = easeOut(prog(t, cur.start, 0.5));
  let a = h(prev), b = h(cur), d = ((b - a + 540) % 360) - 180;
  return (a + d * k + 360) % 360;
}

// ---------- layers ----------
function background(t, hue) {
  const g = ctx.createRadialGradient(W / 2, 700, 50, W / 2, 900, 1400);
  g.addColorStop(0, hsl(hue, 65, 24)); g.addColorStop(.55, hsl(hue, 60, 9)); g.addColorStop(1, '#04050a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // moving diagonal grid
  ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 2;
  const off = (t * 60) % 120;
  ctx.beginPath();
  for (let x = -H; x < W + H; x += 120) { ctx.moveTo(x + off, 0); ctx.lineTo(x + off + H * .5, H); }
  ctx.stroke();
  // particles
  for (const p of PARTICLES) {
    const y = ((p.y - t * p.v) % H + H) % H;
    const x = p.x + Math.sin(t * .8 + p.p) * 20;
    ctx.fillStyle = hsl(hue, 90, 70, .25 + .2 * Math.sin(t * 2 + p.p));
    ctx.beginPath(); ctx.arc(x, y, p.s, 0, 7); ctx.fill();
  }
}

function header(t) {
  const intro = segOf('intro');
  const a = prog(t, intro.start + intro.len - 0.35, 0.35);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - easeOut(a)) * -40);
  text('AI가 절대 못 뺏는', W / 2, 135, { size: 62, color: '#dfe3ff' });
  font(112); const w1 = ctx.measureText('직업 ').width, w2 = ctx.measureText('TOP 10').width;
  const x0 = W / 2 - (w1 + w2) / 2;
  text('직업 ', x0, 245, { size: 112, align: 'left' });
  text('TOP 10', x0 + w1, 245, { size: 112, align: 'left', color: goldGrad(190, 300), glow: 30, glowColor: '#ffb300' });
  ctx.restore();
}

function progressBar(t) {
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 12);
  ctx.fillStyle = goldGrad(0, 12); ctx.fillRect(0, 0, W * clamp(t / TOTAL), 12);
}

function intro(t) {
  const s = segOf('intro'), lt = t - s.start;
  if (lt > s.len) return;
  const out = prog(lt, s.len - 0.3, 0.3);
  ctx.save(); ctx.globalAlpha = 1 - out;
  ctx.translate(W / 2, 800); ctx.scale(1 + out * .25, 1 + out * .25); ctx.translate(-W / 2, -800);
  // robot + prohibition sign
  const rp = easeBack(prog(lt, 0, 0.45));
  ctx.save(); ctx.translate(540 + Math.sin(lt * 40) * (lt < 0.9 ? 6 : 0), 470); ctx.scale(rp, rp);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.arc(0, 0, 200, 0, 7); ctx.fill();
  text('🤖', 0, 10, { size: 230, fam: EMOJI });
  const np = easeBack(prog(lt, 0.85, 0.3));
  if (np > 0) {
    ctx.scale(np, np); ctx.strokeStyle = '#ff3b4e'; ctx.lineWidth = 30; ctx.shadowBlur = 30; ctx.shadowColor = '#ff3b4e';
    ctx.beginPath(); ctx.arc(0, 0, 195, 0, 7); ctx.moveTo(-138, -138); ctx.lineTo(138, 138); ctx.stroke(); ctx.shadowBlur = 0;
  }
  ctx.restore();
  // title lines
  const l1 = easeOut(prog(lt, 0.15, 0.35));
  ctx.globalAlpha = (1 - out) * l1;
  text('AI가', W / 2, 790 + (1 - l1) * 60, { size: 120, glow: 20, glowColor: '#6a5cff' });
  const l2 = easeOut(prog(lt, 0.45, 0.35));
  ctx.globalAlpha = (1 - out) * l2;
  font(124); const parts = [['절대 ', '#fff'], ['못 뺏는', '#ffe14a'], [' 직업', '#fff']];
  let tw = parts.reduce((a, p) => a + ctx.measureText(p[0]).width, 0), x = W / 2 - tw / 2;
  for (const [str, c] of parts) { text(str, x, 940 + (1 - l2) * 60, { size: 124, align: 'left', color: c, stroke: 10, strokeColor: '#0008' }); font(124); x += ctx.measureText(str).width; }
  const l3 = prog(lt, 1.1, 0.45);
  if (l3 > 0) {
    ctx.globalAlpha = 1 - out;
    const sc = easeBack(l3), pulse = 1 + Math.sin(lt * 8) * .02;
    ctx.save(); ctx.translate(W / 2, 1150); ctx.scale(sc * pulse, sc * pulse);
    text('TOP 10', 0, 0, { size: 250, color: goldGrad(-120, 120), glow: 60, glowColor: '#ffae00', stroke: 14, strokeColor: '#3a2000' });
    ctx.restore();
  }
  ctx.restore();
}

function rankCard(t, s) {
  const lt = t - s.start; if (lt < 0 || lt > s.len) return;
  const R = RANKS[s.rank], hue = R.hue, top = s.rank === 1;
  const out = easeOut(prog(lt, s.len - 0.22, 0.22));
  ctx.save(); ctx.translate(-out * 1100, 0); ctx.globalAlpha = 1 - out * .8;

  // #1 rays
  if (top) {
    ctx.save(); ctx.translate(540, 560); ctx.rotate(lt * .5);
    const ra = prog(lt, 0.2, 0.5);
    for (let i = 0; i < 16; i++) {
      ctx.rotate(Math.PI / 8); ctx.fillStyle = `rgba(255,213,74,${.13 * ra})`;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, -1100); ctx.lineTo(60, -1100); ctx.fill();
    }
    ctx.restore();
  }

  // rank number (slides in from left)
  const rn = easeBack(prog(lt, 0, 0.45));
  const nx = -500 + rn * 590;
  ctx.save(); ctx.translate(nx, 560);
  const numColor = s.rank <= 3 ? goldGrad(-130, 130) : '#ffffff';
  text(String(s.rank), 0, 0, { size: 300, align: 'left', color: numColor, stroke: 16, strokeColor: hsl(hue, 70, 20), glow: 40, glowColor: hsl(hue, 90, 55) });
  font(300); const nw = ctx.measureText(String(s.rank)).width;
  text('위', nw + 12, 60, { size: 110, align: 'left', color: s.rank <= 3 ? '#ffd54a' : hsl(hue, 90, 75) });
  ctx.restore();

  // icon bubble
  const ip = easeBack(prog(lt, 0.1, 0.45));
  ctx.save(); ctx.translate(800, 545); ctx.scale(ip, ip);
  ctx.fillStyle = hsl(hue, 75, 50, .25); ctx.beginPath(); ctx.arc(0, 0, 165, 0, 7); ctx.fill();
  ctx.rotate(lt * 1.6); ctx.setLineDash([26, 18]); ctx.lineWidth = 8; ctx.strokeStyle = hsl(hue, 90, 65);
  ctx.beginPath(); ctx.arc(0, 0, 195, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.rotate(-lt * 1.6);
  text(R.icon, 0, 12, { size: 170, fam: EMOJI });
  ctx.restore();

  // category pill
  const cp = easeOut(prog(lt, 0.2, 0.3));
  ctx.globalAlpha = (1 - out * .8) * cp;
  font(42, 700); const cw = ctx.measureText(R.cat).width + 60;
  ctx.fillStyle = hsl(hue, 80, 60, .2); ctx.strokeStyle = hsl(hue, 90, 65); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(W / 2 - cw / 2, 790 - 34, cw, 68, 34); ctx.fill(); ctx.stroke();
  text(R.cat, W / 2, 792, { size: 42, weight: 700, color: hsl(hue, 90, 80) });

  // job name
  const np = easeOut(prog(lt, 0.25, 0.35));
  ctx.globalAlpha = (1 - out * .8) * np;
  const ns = fit(R.name, 118, 980);
  text(R.name, W / 2, 920 + (1 - np) * 70, { size: ns, color: top ? goldGrad(860, 980) : '#fff', glow: 30, glowColor: hsl(hue, 90, 50), stroke: 12, strokeColor: '#0009' });

  // reason chip
  const wp = easeBack(prog(lt, 0.45, 0.4));
  if (wp > 0) {
    ctx.globalAlpha = 1 - out * .8;
    ctx.save(); ctx.translate(W / 2, 1065); ctx.scale(wp, wp);
    const ws = fit(R.why, 52, 900, 800); const ww = ctx.measureText(R.why).width + 90;
    ctx.fillStyle = hsl(hue, 70, 42); ctx.shadowBlur = 30; ctx.shadowColor = hsl(hue, 90, 50);
    ctx.beginPath(); ctx.roundRect(-ww / 2, -52, ww, 104, 52); ctx.fill(); ctx.shadowBlur = 0;
    text(R.why, 0, 2, { size: ws, weight: 800 });
    ctx.restore();
  }
  ctx.restore();

  // confetti for #1
  if (top && lt > 0.3) {
    const ct = lt - 0.3;
    for (const c of CONFETTI) {
      const x = 540 + Math.cos(c.a) * c.sp * ct, y = 560 + Math.sin(c.a) * c.sp * ct + 900 * ct * ct;
      if (y > H + 50) continue;
      ctx.save(); ctx.translate(x, y); ctx.rotate(c.r + c.vr * ct); ctx.fillStyle = c.c;
      ctx.globalAlpha = clamp(1.6 - ct * .6); ctx.fillRect(-c.w / 2, -c.w / 4, c.w, c.w / 2); ctx.restore();
    }
  }
  // flash on entry
  const fl = 1 - prog(lt, 0, 0.18);
  if (fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * (top ? .55 : .3)})`; ctx.fillRect(0, 0, W, H); }
}

function outro(t) {
  const s = segOf('outro'), lt = t - s.start; if (lt < 0) return;
  const words = [['몸', 15, 200], ['마음', 330, 540], ['책임', 200, 880]];
  words.forEach(([w, h, x], i) => {
    const p = easeBack(prog(lt, 0.1 + i * .35, 0.4)); if (p <= 0) return;
    ctx.save(); ctx.translate(x, 560); ctx.scale(p, p);
    ctx.fillStyle = hsl(h, 75, 50, .9); ctx.shadowBlur = 40; ctx.shadowColor = hsl(h, 90, 55);
    ctx.beginPath(); ctx.arc(0, 0, 135, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    text(w, 0, 4, { size: w.length > 1 ? 82 : 110 });
    ctx.restore();
  });
  const p2 = easeOut(prog(lt, 1.35, 0.4));
  if (p2 > 0) {
    ctx.save(); ctx.globalAlpha = p2;
    font(118); const a = '= ', b = '사람', c = '의 몫';
    const tw = ctx.measureText(a + b + c).width; let x = W / 2 - tw / 2; const y = 800 + (1 - p2) * 50;
    for (const [str, col] of [[a, '#fff'], [b, goldGrad(740, 860)], [c, '#fff']]) {
      text(str, x, y, { size: 118, align: 'left', color: col, glow: str === b ? 40 : 0, glowColor: '#ffae00', stroke: 10, strokeColor: '#0008' }); font(118); x += ctx.measureText(str).width;
    }
    ctx.restore();
  }
  const p3 = easeOut(prog(lt, 2.7, 0.4));
  if (p3 > 0) {
    ctx.save(); ctx.globalAlpha = p3;
    text('자격증 · 재교육 방법은', W / 2, 975, { size: 66, weight: 700, color: '#dfe3ff' });
    const bob = Math.sin(lt * 7) * 10;
    text('다음 편에서!', W / 2 - 50, 1095, { size: 108, color: '#ffe14a', stroke: 10, strokeColor: '#0009', glow: 30, glowColor: '#ffae00' });
    text('👉', W / 2 + 330 + bob, 1095, { size: 96, fam: EMOJI });
    ctx.restore();
  }
}

function board(t) {
  const intro = segOf('intro');
  const ba = easeOut(prog(t, intro.start + 1.4, 0.6)); if (ba <= 0) return;
  ctx.save(); ctx.globalAlpha = ba; ctx.translate(0, (1 - ba) * 120);
  ctx.fillStyle = 'rgba(5,6,14,.55)'; ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(36, 1240, W - 72, 640, 36); ctx.fill(); ctx.stroke();
  text('🏆', 330, 1300, { size: 44, fam: EMOJI });
  text('RANKING BOARD', W / 2 + 30, 1302, { size: 44, weight: 900, color: '#ffd54a' });
  const cur = SEGS.find(s => t >= s.start && t < s.start + s.len);
  for (let r = 1; r <= 10; r++) {
    const col = r <= 5 ? 0 : 1, row = (r - 1) % 5;
    const x = 64 + col * 484, y = 1352 + row * 102, w = 468, h = 90;
    const seg = segOf('r' + r), rp = prog(t, seg.start + 0.5, 0.35), revealed = rp > 0;
    const active = cur && cur.id === 'r' + r;
    const R = RANKS[r];
    ctx.save();
    if (revealed) { const sc = easeBack(rp); ctx.translate(x + w / 2, y + h / 2); ctx.scale(sc, sc); ctx.translate(-(x + w / 2), -(y + h / 2)); }
    ctx.fillStyle = revealed ? hsl(R.hue, 60, 30, active ? .9 : .55) : 'rgba(255,255,255,.05)';
    if (active) { ctx.shadowBlur = 30; ctx.shadowColor = hsl(R.hue, 90, 55); }
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 22); ctx.fill(); ctx.shadowBlur = 0;
    if (active) { ctx.strokeStyle = hsl(R.hue, 95, 70); ctx.lineWidth = 4; ctx.stroke(); }
    const medal = { 1: '#ffd54a', 2: '#d9e1ea', 3: '#e09a5a' }[r];
    ctx.fillStyle = medal || 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(x + 50, y + h / 2, 32, 0, 7); ctx.fill();
    text(String(r), x + 50, y + h / 2 + 2, { size: 36, color: medal ? '#2a1a00' : '#fff' });
    if (revealed) {
      const fs = fit(R.name, 40, w - 110, 800);
      text(R.name, x + 96, y + h / 2 + 2, { size: fs, weight: 800, align: 'left' });
    } else {
      text('? ? ?', x + 96, y + h / 2 + 2, { size: 38, weight: 800, align: 'left', color: 'rgba(255,255,255,.3)' });
    }
    ctx.restore();
  }
  ctx.restore();
}

function draw(t) {
  t = clamp(t, 0, TOTAL - 0.001);
  const hue = hueAt(t);
  background(t, hue);
  header(t);
  intro(t);
  for (const s of SEGS) if (s.rank) rankCard(t, s);
  outro(t);
  board(t);
  progressBar(t);
}
window.draw = draw; window.SEGS = SEGS;

// ---------- audio ----------
let actx = null, voiceBufs = {}, master = null, noiseBuf = null, runId = 0;
async function ensureAudio() {
  if (actx) return;
  actx = new AudioContext();
  for (const v of VOICE) {
    const bin = Uint8Array.from(atob(v.b64), c => c.charCodeAt(0));
    voiceBufs[v.id] = await actx.decodeAudioData(bin.buffer);
  }
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function env(g, t, peak, a, dcy) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dcy); }
function kick(out, t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  env(g, t, .9, .005, .28); o.connect(g).connect(out); o.start(t); o.stop(t + .35);
}
function noiseHit(out, t, { f = 8000, type = 'highpass', peak = .2, a = .002, d = .05, sweep = null } = {}) {
  const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(f, t);
  if (sweep) fl.frequency.exponentialRampToValueAtTime(sweep, t + a + d);
  env(g, t, peak, a, d); s.connect(fl).connect(g).connect(out); s.start(t); s.stop(t + a + d + .05);
}
function tone(out, t, freq, { type = 'sine', peak = .2, a = .005, d = .5, lp = null } = {}) {
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
  let node = o;
  if (lp) { const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); node = f; }
  env(g, t, peak, a, d); node.connect(g).connect(out); o.start(t); o.stop(t + a + d + .05);
}
function schedule(t0, dest) {
  if (master) { try { master.disconnect(); } catch (e) {} }
  master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination); if (dest) master.connect(dest);
  // music bus
  const bgm = actx.createGain(); bgm.connect(master);
  bgm.gain.setValueAtTime(.32, t0); bgm.gain.setValueAtTime(.32, t0 + TOTAL - 1.2); bgm.gain.linearRampToValueAtTime(0.0001, t0 + TOTAL);
  const beat = 0.5; // 120 BPM
  const bassNotes = [55, 43.65, 65.41, 49]; // A1 F1 C2 G1
  for (let b = 0; b * beat < TOTAL - .5; b++) {
    const t = t0 + b * beat;
    kick(bgm, t);
    noiseHit(bgm, t + beat / 2, { peak: .12 });
    const n = bassNotes[Math.floor(b / 4) % 4];
    tone(bgm, t, n, { type: 'sawtooth', peak: .22, d: .2, lp: 380 });
    tone(bgm, t + beat / 2, n * 2, { type: 'sawtooth', peak: .12, d: .15, lp: 600 });
  }
  // transitions + voice
  for (const s of SEGS) {
    const ts = t0 + s.start;
    if (s.id !== 'intro') noiseHit(master, ts - .12, { type: 'bandpass', f: 400, sweep: 4000, peak: .35, a: .1, d: .25 });
    if (s.rank) {
      const base = s.rank === 1 ? 523.25 : 659.25;
      tone(master, ts + .05, base, { peak: .12, d: .6 });
      tone(master, ts + .05, base * 1.5, { peak: .08, d: .6 });
      if (s.rank === 1) [0, .12, .24, .36].forEach((dt, i) => tone(master, ts + .3 + dt, [523.25, 659.25, 783.99, 1046.5][i], { type: 'triangle', peak: .15, d: .5 }));
    }
    const buf = voiceBufs[s.id];
    if (buf) { const src = actx.createBufferSource(), g = actx.createGain(); g.gain.value = 1.15; src.buffer = buf; src.connect(g).connect(master); src.start(ts + .06); }
  }
}

// ---------- playback / recording ----------
const status = document.getElementById('status');
const btnPlay = document.getElementById('play'), btnRec = document.getElementById('rec');
function pickMime() {
  const c = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
async function start(record) {
  btnPlay.disabled = btnRec.disabled = true;
  status.textContent = '준비 중…';
  await ensureAudio(); if (actx.state === 'suspended') await actx.resume();
  const id = ++runId;
  let rec = null, chunks = [], dest = null, mime = '';
  if (record) {
    dest = actx.createMediaStreamDestination();
    mime = pickMime();
    const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
    rec = new MediaRecorder(stream, { mimeType: mime || undefined, videoBitsPerSecond: 10_000_000, audioBitsPerSecond: 192_000 });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const type = rec.mimeType || mime || 'video/webm';
      const blob = new Blob(chunks, { type }), ext = type.includes('mp4') ? 'mp4' : 'webm';
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `ai-jobs-top10.${ext}`; a.textContent = `💾 ai-jobs-top10.${ext} 다시 받기`;
      a.click();
      status.innerHTML = ''; status.appendChild(a);
    };
  }
  draw(0);
  const t0 = actx.currentTime + 0.15;
  schedule(t0, dest);
  if (rec) rec.start(250);
  status.textContent = record ? '⏺ 녹화 중… 이 탭을 그대로 두세요 (30초)' : '▶ 재생 중';
  const loop = () => {
    if (id !== runId) return;
    const t = actx.currentTime - t0;
    draw(Math.max(0, t));
    if (t < TOTAL + 0.1) requestAnimationFrame(loop);
    else {
      btnPlay.disabled = btnRec.disabled = false;
      if (rec) { rec.stop(); status.textContent = '저장 중…'; } else status.textContent = '완료';
    }
  };
  requestAnimationFrame(loop);
}
btnPlay.onclick = () => start(false);
btnRec.onclick = () => start(true);

const q = new URLSearchParams(location.search).get('t');
draw(q ? +q : 0);
status.textContent = VOICE.length ? `음성 ${VOICE.length}개 · 녹화 형식: ${(pickMime() || '미지원').split(';')[0]}` : '⚠ 음성 데이터 없음 (make-voice.ps1 실행 필요)';
</script>
</body>
